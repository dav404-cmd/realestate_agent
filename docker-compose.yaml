services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: realestate-backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: realestate-frontend

    environment:
      - PUBLIC_API_BASE=http://localhost:8000
      - API_BASE_INTERNAL=http://backend:8000

    ports:
      - "5500:5500"

    depends_on:
      - backend

    restart: unless-stopped

  airflow-db:
    image: postgres:17
    container_name: realestate-airflow-db

    environment:
      POSTGRES_USER : airflow
      POSTGRES_PASSWORD : airflow
      POSTGRES_DB : airflow

    volumes:
      - airflow-db-data:/var/lib/postgresql/data

    restart: unless-stopped

  airflow:
    image: apache/airflow:3.0.6-python3.11
    container_name: realestate_airflow
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    ports:
      - "8081:8080"

    command: standalone
    restart: unless-stopped

volumes:
  airflow-db-data: